name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auto Find and Setup Project
        run: |
          if [ -f "my_progress.zip" ]; then
            unzip -o my_progress.zip
          fi
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            DIR=$(dirname "$PUBSPEC_PATH")
            if [ "$DIR" != "." ]; then
              cp -rf $DIR/* .
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Regenerate Android Folder
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Install Dependencies & Fix Code Errors
        run: |
          flutter pub get
          # Add missing dart:typed_data import
          sed -i '1s/^/import "dart:typed_data";\n/' lib/services/encryption_service.dart || true
          # Fix Uint8List type conversion
          sed -i 's/.*_cachedKey = enc.Key.*/    _cachedKey = enc.Key(Uint8List.fromList(Uint8ListFromDigest(digest)));/g' lib/services/encryption_service.dart || true
          # Generate Hive adapter (.g.dart) files
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-progress-app
          path: build/app/outputs/flutter-apk/app-release.apk
          
